# Minimum read-only permissions lcars-k8s needs.
#
#   kubectl apply -f rbac.yaml
#   kubectl create token lcars-k8s -n kube-system --duration 8h
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lcars-k8s
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lcars-k8s
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "events", "namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lcars-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lcars-k8s
subjects:
  - kind: ServiceAccount
    name: lcars-k8s
    namespace: kube-system
